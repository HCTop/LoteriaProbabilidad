name: Actualizar Históricos de Loterías

on:
  # Ejecutar cada día a las 00:30 hora España (22:30 UTC en invierno, 21:30 en verano)
  schedule:
    - cron: '30 22 * * *'
  
  # También permitir ejecución manual
  workflow_dispatch:

jobs:
  actualizar-datos:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Mostrar información del sistema
        run: |
          echo "📅 Fecha actual: $(date)"
          echo "🐍 Python: $(python --version)"
          echo "📁 Directorio: $(pwd)"
      
      - name: Ejecutar script de descarga
        run: |
          cd scripts
          python actualizar_datos.py
        timeout-minutes: 30
      
      - name: Verificar archivos generados
        run: |
          echo "📊 Archivos CSV generados:"
          ls -la app/src/main/res/raw/*.csv 2>/dev/null || echo "No se encontraron archivos"
          echo ""
          echo "📈 Conteo de líneas por archivo:"
          for csv in app/src/main/res/raw/*.csv; do
            if [ -f "$csv" ]; then
              NOMBRE=$(basename "$csv")
              LINEAS=$(wc -l < "$csv")
              echo "  $NOMBRE: $LINEAS líneas"
            fi
          done
      
      - name: Verificar cambios en los CSV
        id: verify
        run: |
          if [ -z "$(git status --porcelain app/src/main/res/raw datos)" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "📭 No hay cambios en los datos"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "📬 Se detectaron cambios en los CSV"
            git diff --stat app/src/main/res/raw/*.csv
          fi
      
      - name: Commit y push de los cambios
        if: steps.verify.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Añadir los CSV actualizados y los botes del próximo sorteo
          git add app/src/main/res/raw/*.csv
          [ -f datos/botes.json ] && git add datos/botes.json
          
          # Crear commit con fecha y hora
          FECHA=$(date +'%Y-%m-%d %H:%M')
          git commit -m "📊 Actualización automática de históricos - $FECHA" \
                     -m "Datos descargados de fuentes oficiales"
          
          # Push al repositorio
          git push
      
      - name: Resumen de la ejecución
        run: |
          echo "## 📊 Resumen de Actualización" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Fecha:** $(date +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Archivo | Sorteos |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|---------|" >> $GITHUB_STEP_SUMMARY
          for csv in app/src/main/res/raw/*.csv; do
            if [ -f "$csv" ]; then
              NOMBRE=$(basename "$csv")
              LINEAS=$(($(wc -l < "$csv") - 1))
              echo "| $NOMBRE | $LINEAS |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.verify.outputs.changed }}" == "true" ]; then
            echo "✅ **Datos actualizados correctamente**" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ **Sin cambios detectados**" >> $GITHUB_STEP_SUMMARY
          fi
